name: MILLER one-time web hero optimization
on:
  push:
    branches:
      - miller/racing-hero-2026-11-04
    paths:
      - .github/workflows/miller-race-hero-optimize.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encode browser-friendly muted hero
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of compact assets/hero-race-kling-v1.mp4
          ffmpeg -hide_banner -loglevel error -y -i assets/hero-race-kling-v1.mp4 -an -vf "fps=30" -c:v libx264 -preset medium -crf 22 -maxrate 8M -bufsize 16M -pix_fmt yuv420p -movflags +faststart assets/hero-race-web.mp4
          test "$(stat -c%s assets/hero-race-web.mp4)" -lt 10000000
          ffprobe -v error -show_entries format=duration,size -of compact assets/hero-race-web.mp4
      - name: Commit optimized asset on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-race-web.mp4
          git commit -m "assets: optimize approved race hero for web"
          git push origin HEAD:refs/heads/miller/racing-hero-2026-11-04
