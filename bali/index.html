<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a2d">
<title>Bali Expedition</title>
<style>
html,body{height:100%;margin:0;background:#102a2d;color:#f4efe4;font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.load{height:100%;display:grid;place-items:center;text-align:center;letter-spacing:.08em;text-transform:uppercase}
.load span{opacity:.72}
</style>
</head>
<body>
<div class="load"><span>Loading Bali Expedition…</span></div>
<script>
(async()=>{try{
const files=["chunks/01.txt","chunks/02.txt","chunks/03.txt","chunks/04.txt","chunks/05.txt","chunks/06.txt","chunks/07.txt","chunks/08.txt","chunks/09.txt","chunks/10.txt","chunks/11.txt","chunks/12.txt"];
const parts=await Promise.all(files.map(f=>fetch(f,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
const html=parts.join("");
document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="load"><span>Не удалось загрузить проект. Обновите страницу.</span></div>';console.error(e)}})();
</script>
</body>
</html>
